name: Build and Release

on:
  push:
    branches-ignore:
      - main
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config make gawk libfontconfig1-dev
      - name: Build
        run: cargo build --release
      - name: Package (Linux tar.gz)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ARCHIVE="mtp-filler-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          else
            ARCHIVE="mtp-filler-linux-x86_64.tar.gz"
          fi
          chmod +x target/release/mtp-filler
          tar -czf "target/release/${ARCHIVE}" -C target/release mtp-filler
          echo "ARCHIVE=target/release/${ARCHIVE}" >> "$GITHUB_ENV"
      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: mtp-filler-linux-x86_64
          path: ${{ env.ARCHIVE }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ARCHIVE }}

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (Windows)
        run: cargo build --target x86_64-pc-windows-msvc --release

      - name: Rename binary
        if: startsWith(github.ref, 'refs/tags/')
        run: move target\x86_64-pc-windows-msvc\release\mtp-filler.exe target\x86_64-pc-windows-msvc\release\mtp-filler-${{ github.ref_name }}.exe
      - name: Upload artifact (Windows tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mtp-filler-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/mtp-filler-${{ github.ref_name }}.exe
      - name: Upload artifact (Windows branch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mtp-filler-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/mtp-filler.exe

      - name: Release (Windows)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: target/x86_64-pc-windows-msvc/release/mtp-filler-${{ github.ref_name }}.exe

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites (macOS arm64)
        run: |
          brew update
          brew install libmtp pkg-config

      - name: Build (macOS arm64)
        run: cargo build --release

      - name: Package (macOS arm64 tar.gz)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ARCHIVE="mtp-filler-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          else
            ARCHIVE="mtp-filler-macos-arm64.tar.gz"
          fi
          chmod +x target/release/mtp-filler
          tar -czf "target/release/${ARCHIVE}" -C target/release mtp-filler
          echo "ARCHIVE=target/release/${ARCHIVE}" >> "$GITHUB_ENV"
      - name: Upload artifact (macOS arm64)
        uses: actions/upload-artifact@v4
        with:
          name: mtp-filler-macos-arm64
          path: ${{ env.ARCHIVE }}

      - name: Release (macOS arm64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ARCHIVE }}

  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites (macOS x86_64)
        run: |
          brew update
          brew install libmtp pkg-config

      - name: Build (macOS x86_64)
        run: cargo build --release

      - name: Package (macOS x86_64 tar.gz)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ARCHIVE="mtp-filler-${GITHUB_REF_NAME}-macos-x86_64.tar.gz"
          else
            ARCHIVE="mtp-filler-macos-x86_64.tar.gz"
          fi
          chmod +x target/release/mtp-filler
          tar -czf "target/release/${ARCHIVE}" -C target/release mtp-filler
          echo "ARCHIVE=target/release/${ARCHIVE}" >> "$GITHUB_ENV"
      - name: Upload artifact (macOS x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: mtp-filler-macos-x86_64
          path: ${{ env.ARCHIVE }}

      - name: Release (macOS x86_64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ARCHIVE }}
